apply plugin: 'com.android.application'

android {
    compileSdkVersion 28

    defaultConfig {
        applicationId "com.oldschoolnetwork.services.classicinstaller"
        minSdkVersion 14       // Android 4.0 Ice Cream Sandwich
        targetSdkVersion 28    // Android 9.0 Pie
        versionCode 10
        versionName "alpha-0.35"
    }

    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.12'
    implementation 'androidx.vectordrawable:vectordrawable:1.1.0'
    implementation 'androidx.core:core:1.3.0'
    implementation 'androidx.annotation:annotation:1.2.0'
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'com.android.support:support-v4:28.0.0'
}

task verifyReleasePayload {
    doLast {
        def manifest = file('src/main/assets/services.json')
        if (!manifest.exists()) throw new GradleException('Prepare signed Core and Store APKs with tools/prepare-bundle.py before a release build.')
        def releases = new groovy.json.JsonSlurper().parse(manifest).releases
        if (!releases || !releases.any { it.id == 'core' } || !releases.any { it.id == 'store' }) throw new GradleException('The release payload must include Core and Store.')
        releases.each { release ->
            def apk = file('src/main/assets/apks/' + release.asset)
            if (release.signing != 'release' || !apk.exists()) throw new GradleException('Missing signed release APK: ' + release.id)
            def digest = java.security.MessageDigest.getInstance('SHA-256').digest(apk.bytes).encodeHex().toString()
            if (digest != release.sha256) throw new GradleException('The bundled APK changed. Regenerate the payload manifest: ' + release.id)
        }
    }
}
afterEvaluate { preReleaseBuild.dependsOn verifyReleasePayload }
